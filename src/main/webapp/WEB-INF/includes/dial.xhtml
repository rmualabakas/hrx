<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets">
    <!-- Cadran du cycle d'évaluation HRX : 12 mois sur un cercle depuis le lancement (en haut). -->
    <svg class="hx-dial" viewBox="0 0 320 320" aria-hidden="true" focusable="false"
         style="--hx-dash: #{empty dialDash ? '380' : dialDash};">
        <circle class="hx-dial__ring" cx="160" cy="160" r="120"/>
        <circle class="hx-dial__arc" cx="160" cy="160" r="120" transform="rotate(-90 160 160)" pathLength="1000"/>

        <g class="hx-dial__ticks">
            <line class="hx-dial__tick" x1="225" y1="47.4" x2="218" y2="59.5"/>
            <line class="hx-dial__tick" x1="272.6" y1="95" x2="260.5" y2="102"/>
            <line class="hx-dial__tick" x1="290" y1="160" x2="276" y2="160"/>
            <line class="hx-dial__tick" x1="272.6" y1="225" x2="260.5" y2="218"/>
            <line class="hx-dial__tick" x1="225" y1="272.6" x2="218" y2="260.5"/>
            <line class="hx-dial__tick hx-dial__tick--major" x1="160" y1="290" x2="160" y2="272"/>
            <line class="hx-dial__tick" x1="95" y1="272.6" x2="102" y2="260.5"/>
            <line class="hx-dial__tick" x1="47.4" y1="225" x2="59.5" y2="218"/>
            <line class="hx-dial__tick" x1="30" y1="160" x2="44" y2="160"/>
            <line class="hx-dial__tick" x1="47.4" y1="95" x2="59.5" y2="102"/>
            <line class="hx-dial__tick" x1="95" y1="47.4" x2="102" y2="59.5"/>
            <line class="hx-dial__tick hx-dial__tick--major" x1="160" y1="30" x2="160" y2="48"/>
        </g>

        <g class="hx-dial__months" text-anchor="middle" dominant-baseline="middle">
            <text class="hx-dial__month" x="233.5" y="32.7">1</text>
            <text class="hx-dial__month" x="287.3" y="86.5">2</text>
            <text class="hx-dial__month" x="307" y="160">3</text>
            <text class="hx-dial__month" x="287.3" y="233.5">4</text>
            <text class="hx-dial__month" x="233.5" y="287.3">5</text>
            <text class="hx-dial__month" x="86.5" y="287.3">7</text>
            <text class="hx-dial__month" x="32.7" y="233.5">8</text>
            <text class="hx-dial__month" x="13" y="160">9</text>
            <text class="hx-dial__month" x="32.7" y="86.5">10</text>
            <text class="hx-dial__month" x="86.5" y="32.7">11</text>
        </g>

        <!-- 6 mois (bas) : campagne de mi-parcours, 12 mois (haut) : fin d'année -->
        <circle class="hx-dial__node--halo" cx="160" cy="280" r="20"/>
        <circle class="hx-dial__node" cx="160" cy="280" r="8"/>
        <circle class="hx-dial__node hx-dial__node--pending" cx="160" cy="40" r="8"/>

        <text class="hx-dial__center-big" x="160" y="158" text-anchor="middle">6 et 12</text>
        <text class="hx-dial__center-small" x="160" y="182" text-anchor="middle">mois après le lancement</text>
        <text class="hx-dial__label" x="160" y="250" text-anchor="middle">Mi-parcours <tspan class="sub">6 mois</tspan></text>
        <text class="hx-dial__label" x="160" y="74" text-anchor="middle">Objectifs et bilan <tspan class="sub">12 mois</tspan></text>
    </svg>
</ui:composition>
